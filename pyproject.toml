[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "orolp"
version = "1.4.0"
description = "RobotWorld - Open-source Offline Programming Software for Industrial Robots"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "RobotWorld Contributors"}
]
keywords = ["robotics", "offline-programming", "OLP", "industrial-robot", "digital-twin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "jinja2>=3.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.4", "PyOpenGL"]
ros2 = ["rclpy>=3.0"]
dev = ["pytest>=7.0", "black", "flake8", "mypy", "sphinx"]
all = ["orolp[gui,ros2,dev]"]

[project.urls]
Homepage = "https://github.com/your-org/openrobolp"
Documentation = "https://openrobolp.readthedocs.io"
Repository = "https://github.com/your-org/openrobolp"
Issues = "https://github.com/your-org/openrobolp/issues"

[project.scripts]
orolp = "orolp.cli:main"

[tool.setuptools]
packages = ["orolp", "orolp.post"]
package-dir = {"orolp" = "python/orolp"}

[tool.setuptools.package-data]
orolp = ["templates/*.j2", "assets/*"]

# --------------------------------------------------------------------------- #
# v1.4.0 构建档位开关：MVP 档要隐藏哪些入口（代码里的默认清单以这里为准）
#
# 后续完善某个功能后，直接从下面删掉它，入口就回来；删空 = 全功能档。
# 可用名见 python/orolp/features.py 的 ALL_FEATURES，写错的名字会被忽略。
# 开发环境临时看全部：OROLP_FEATURES=full app.py（不用改这个文件）。
# --------------------------------------------------------------------------- #
[tool.orolp.features]
hidden-in-mvp = [
    "sequence_editor",   # 工艺时序（泳道图）编辑器：交互还在改（队列 P5）
    "plc_logic",         # PLC 程序逻辑：出码尚未完善（队列 P2）
    "subprogram",        # 机器人子程序：尚未完善（队列 P2）
    "controller_link",   # 真机连接（Socket/SSH 传程序 + 回读）：从未上真机验证
    "real_machine_upload",  # 上传真机/真机验证按钮：等 MVP 跑通后再放开
    "plugins",           # 插件生态（覆盖层 / 重扫描 / 插件状态）：生态未成型，属开发者项
    "dev_tools",         # 开发者项：缓存状态 / 清空缓存
    "hardware_list",     # 代码生成 → 硬件列表：设备台账还没和出码打通（队列 P2）
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
