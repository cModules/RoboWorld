name: Windows Installer

# Windows 安装包发布流水线（PyInstaller 不支持跨平台打包，exe 必须在
# Windows 环境产出——此前只能找一台 Windows 机器手工跑 packaging/ 下两个脚本）。
#
# 触发口径与三段链：
# * workflow_dispatch —— Actions 页面手动触发，**只跑 build-installer**
#   （出包验证用，不发 Release、不传飞书，避免试验性构建污染发布面）；
# * push tag v* —— 发版：build-installer → publish-release → upload-feishu，
#   三段按 needs: 顺序串联，前一段失败后续段自动跳过。
#
# Inno Setup 6 在 windows-latest runner 上预装（Program Files (x86)\Inno Setup 6），
# build_installer_win.ps1 的候选搜索路径已覆盖，无需 choco install。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # ------------------------------------------------------------------ #
  # 第一段：构建安装包 + 源码包（手动触发 / tag 都会跑）
  # ------------------------------------------------------------------ #
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and PyInstaller
        # gui extra 必装：spec 的 hiddenimports 需要 PySide6/PyOpenGL（与 ci.yml
        # build-python 同理）。不建 .venv：两个打包脚本找不到 .venv 时会自动
        # 回退到 PATH 上的 python，即 setup-python 装的这个。
        run: pip install -e ".[gui]" pyinstaller

      - name: Build RoboWorld.exe (PyInstaller)
        # 脚本内部自校验 dist\RoboWorld.exe 存在，失败即 exit 1。
        run: ./packaging/build_win64.ps1
        shell: pwsh

      - name: Install Inno Setup Chinese language file
        # runner 上 Chocolatey 预装的 Inno Setup 是精简包：有 Default.isl（英文）
        # 但没有 Languages\ChineseSimplified.isl，编译双语安装器时报
        # "Couldn't open include file"（2026-10-20 CI 实锤）。runner 在 GitHub
        # 数据中心，github.com 网络正常，直接下载官方语言文件补进去。
        run: |
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          New-Item -ItemType Directory -Force -Path $langDir | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "$langDir\ChineseSimplified.isl"
        shell: pwsh

      - name: Build installer (Inno Setup)
        # 版本号由脚本从 support.__version__ 读出、经 /D 传给 setup.iss。
        run: ./packaging/build_installer_win.ps1
        shell: pwsh

      - name: Package source code
        # 源码也随安装包一起进 artifact：下游飞书段直接下载，不用重新 archive。
        id: meta
        run: |
          $version = (& python -c "from support import __version__; print(__version__)").Trim()
          git archive --format=tar.gz --output="dist/RoboWorld-source-$version.tar.gz" HEAD
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload installer + source artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoboWorld-Windows-Setup
          path: |
            dist/RoboWorld-Setup-*.exe
            dist/RoboWorld-source-*.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # 第二段：发 GitHub Release（仅 tag 触发）
  # ------------------------------------------------------------------ #
  publish-release:
    name: Publish installer to GitHub Release
    needs: build-installer
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: RoboWorld-Windows-Setup

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: RoboWorld-Setup-*.exe

  # ------------------------------------------------------------------ #
  # 第三段：存档到飞书云空间（仅 tag 触发，在 Release 之后）
  # ------------------------------------------------------------------ #
  upload-feishu:
    name: Archive release to Feishu
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: RoboWorld-Windows-Setup

      - name: Skip notice (secrets not configured)
        if: ${{ secrets.FEISHU_APP_ID == '' }}
        run: echo "未配置 FEISHU_* secrets，跳过飞书上传。"

      - name: Upload to Feishu drive
        # 把安装包 + 源代码包上传到飞书云空间的 <父文件夹>/<版本号>/ 下。
        # 仅 tag 触发且配置了 FEISHU_* secrets 时执行（secrets 不能用在 job 级 if，
        # 所以 job 级只判 tag，这里 step 级再判 secrets）。
        # 三个 secrets：FEISHU_APP_ID / FEISHU_APP_SECRET / FEISHU_FOLDER_TOKEN（父文件夹 token）。
        if: ${{ secrets.FEISHU_APP_ID != '' }}
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
        run: |
          VER="${{ needs.build-installer.outputs.version }}"
          python tools/upload_to_feishu.py \
            --parent-token "$FEISHU_FOLDER_TOKEN" \
            --version "$VER" \
            "RoboWorld-Setup-$VER.exe" \
            "RoboWorld-source-$VER.tar.gz"
