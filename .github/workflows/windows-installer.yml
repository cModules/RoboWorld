name: Windows Installer

# Windows 安装包发布流水线（PyInstaller 不支持跨平台打包，exe 必须在
# Windows 环境产出——此前只能找一台 Windows 机器手工跑 packaging/ 下两个脚本）。
#
# 触发口径与三段链：
# * workflow_dispatch —— Actions 页面手动触发，**只跑 build-installer**
#   （出包验证用，不发 Release、不传网盘，避免试验性构建污染发布面）；
# * push tag v* —— 发版：build-installer → publish-release → upload-baidu-pan，
#   三段按 needs: 顺序串联，前一段失败后续段自动跳过。
#
# Inno Setup 6 在 windows-latest runner 上预装（Program Files (x86)\Inno Setup 6），
# build_installer_win.ps1 的候选搜索路径已覆盖，无需 choco install。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # ------------------------------------------------------------------ #
  # 第一段：构建安装包 + 源码包（手动触发 / tag 都会跑）
  # ------------------------------------------------------------------ #
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and PyInstaller
        # gui extra 必装：spec 的 hiddenimports 需要 PySide6/PyOpenGL（与 ci.yml
        # build-python 同理）。不建 .venv：两个打包脚本找不到 .venv 时会自动
        # 回退到 PATH 上的 python，即 setup-python 装的这个。
        run: pip install -e ".[gui]" pyinstaller

      - name: Build RoboWorld.exe (PyInstaller)
        # 脚本内部自校验 dist\RoboWorld.exe 存在，失败即 exit 1。
        run: ./packaging/build_win64.ps1
        shell: pwsh

      - name: Install Inno Setup Chinese language file
        # runner 上 Chocolatey 预装的 Inno Setup 是精简包：有 Default.isl（英文）
        # 但没有 Languages\ChineseSimplified.isl，编译双语安装器时报
        # "Couldn't open include file"（2026-10-20 CI 实锤）。runner 在 GitHub
        # 数据中心，github.com 网络正常，直接下载官方语言文件补进去。
        run: |
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          New-Item -ItemType Directory -Force -Path $langDir | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "$langDir\ChineseSimplified.isl"
        shell: pwsh

      - name: Build installer (Inno Setup)
        # 版本号由脚本从 support.__version__ 读出、经 /D 传给 setup.iss。
        run: ./packaging/build_installer_win.ps1
        shell: pwsh

      - name: Package source code
        # 源码也随安装包一起进 artifact：下游网盘段直接下载，不用重新 archive。
        id: meta
        run: |
          $version = (& python -c "from support import __version__; print(__version__)").Trim()
          git archive --format=tar.gz --output="dist/RoboWorld-source-$version.tar.gz" HEAD
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload installer + source artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoboWorld-Windows-Setup
          path: |
            dist/RoboWorld-Setup-*.exe
            dist/RoboWorld-source-*.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # 第二段：发 GitHub Release（仅 tag 触发）
  # ------------------------------------------------------------------ #
  publish-release:
    name: Publish installer to GitHub Release
    needs: build-installer
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: RoboWorld-Windows-Setup

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: RoboWorld-Setup-*.exe

  # ------------------------------------------------------------------ #
  # 第三段：存档到百度网盘（仅 tag 触发，在 Release 之后）
  # ------------------------------------------------------------------ #
  upload-baidu-pan:
    name: Archive release to Baidu Pan
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: RoboWorld-Windows-Setup

      - name: Skip notice (secrets not configured)
        if: ${{ secrets.BAIDU_APP_KEY == '' }}
        run: echo "未配置 BAIDU_* secrets，跳过百度网盘上传。"

      - name: Upload to Baidu Pan
        # 把安装包 + 源代码包上传到 <BAIDU_TARGET_DIR>/<版本号>/。
        # 仅 tag 触发且配置了 BAIDU_* secrets 时执行（secrets 不能用在 job 级 if，
        # 所以 job 级只判 tag，这里 step 级再判 secrets）。
        # secrets：BAIDU_APP_KEY / BAIDU_APP_SECRET / BAIDU_REFRESH_TOKEN
        #         BAIDU_TARGET_DIR（可选，默认 /apps/RoboWorld/releases）
        id: upload
        if: ${{ secrets.BAIDU_APP_KEY != '' }}
        env:
          BAIDU_APP_KEY: ${{ secrets.BAIDU_APP_KEY }}
          BAIDU_APP_SECRET: ${{ secrets.BAIDU_APP_SECRET }}
          BAIDU_REFRESH_TOKEN: ${{ secrets.BAIDU_REFRESH_TOKEN }}
          BAIDU_TARGET_DIR: ${{ secrets.BAIDU_TARGET_DIR }}
        run: |
          VER="${{ needs.build-installer.outputs.version }}"
          TARGET="${BAIDU_TARGET_DIR:-/apps/RoboWorld/releases}"
          python tools/upload_to_baidu_pan.py \
            --target-dir "$TARGET" \
            --version "$VER" \
            "RoboWorld-Setup-$VER.exe" \
            "RoboWorld-source-$VER.tar.gz"

      - name: Persist rotated refresh_token
        # 百度的 refresh_token 一次性：刷新后旧值立即失效。不回写的话下次发版必失败。
        # 用 gh CLI 写回 Secret（它内部做 libsodium 加密，无需额外依赖）。
        # 需要额外配 SECRETS_PAT（对仓库有 secrets:write 权限的 PAT）；未配置则只提示。
        if: ${{ always() && steps.upload.outputs.new_refresh_token != '' }}
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          NEW_RT: ${{ steps.upload.outputs.new_refresh_token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::未配置 SECRETS_PAT，请手动把 BAIDU_REFRESH_TOKEN 更新为下面这个新值："
            echo "$NEW_RT"
            exit 0
          fi
          gh secret set BAIDU_REFRESH_TOKEN --body "$NEW_RT"
          echo "已自动回写 BAIDU_REFRESH_TOKEN"
