name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 公开仓库一旦提交就无法撤回（git 历史会一直留着），所以把卫生检查
  # 放在最前面、且设成 fail-fast，避免后面的构建白跑。
  repo-hygiene:
    name: Repo hygiene (no secrets / no private host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check for credentials and private repo hosts
        # 只用标准库，无需安装依赖
        run: python3 tools/check_no_secrets.py

  build-cpp:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake libeigen3-dev             libpinocchio-dev libfcl-dev pybind11-dev python3-dev
      - name: Build C++ core
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_PYTHON_BINDINGS=ON -DBUILD_TESTS=ON
          make -j$(nproc)
      - name: Run C++ tests
        run: cd build && ctest --output-on-failure

  build-python:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y libeigen3-dev libpinocchio-dev libfcl-dev
          pip install -e ".[dev]"
      - name: Run Python tests
        # 真实回归套件在 tests/（test_olp.py / test_post.py）；
        # python/tests/ 是早期占位，一并跑以防回归。
        run: pytest tests/ python/tests/ -v
      - name: Lint
        run: |
          black --check python/
          flake8 python/ --max-line-length=100
