<svg viewBox="0 0 680 540" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>RobotWorld 领域架构方案</title>
  <desc>App壳之下的七大业务域（robot/workcell/programming/process/control/plc/simulation）加共享内核与post适配器注册表，依赖方向app到domains到kernel</desc>
  <rect x="0" y="0" width="680" height="540" fill="#FFFFFF"/>
  <text x="40" y="30" font-size="14" font-weight="500" fill="#2C2C2A" font-family="PingFang SC, sans-serif">RobotWorld 领域架构方案（7 业务域 + 内核 + App 壳）</text>

  <rect x="40" y="44" width="600" height="56" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="66" font-size="13" font-weight="500" fill="#0C447C" font-family="PingFang SC, sans-serif">App 壳 · orolp/app/（全项目唯一 PySide6 归宿）</text>
  <text x="60" y="87" font-size="12" fill="#185FA5" font-family="PingFang SC, sans-serif">views · controllers · session ｜ 存量 4 个 GUI 债务文件冻结待迁入</text>

  <line x1="340" y1="102" x2="340" y2="116" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrowD)"/>
  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="120" width="141" height="124" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="51" y="140" font-size="12" font-weight="500" fill="#042C53" font-family="PingFang SC, sans-serif">robot 机器人域</text>
  <text x="51" y="161" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">robot · kinematics</text>
  <text x="51" y="178" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">dynamics · envelope</text>
  <text x="51" y="195" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">library：catalog·specs</text>
  <text x="51" y="212" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">panel → app（债务）</text>
  <text x="51" y="232" font-size="11" fill="#185FA5" font-family="PingFang SC, sans-serif">FK/IK · 动力学 · 模型库</text>

  <rect x="193" y="120" width="141" height="124" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="204" y="140" font-size="12" font-weight="500" fill="#042C53" font-family="PingFang SC, sans-serif">workcell 场景域</text>
  <text x="204" y="161" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">world：scene·geometry</text>
  <text x="204" y="178" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">components·placement</text>
  <text x="204" y="195" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">parts_library·templates</text>
  <text x="204" y="212" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">cell · collision</text>
  <text x="204" y="232" font-size="11" fill="#185FA5" font-family="PingFang SC, sans-serif">场景图 · 工件 · 碰撞</text>

  <rect x="346" y="120" width="141" height="124" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="357" y="140" font-size="12" font-weight="500" fill="#042C53" font-family="PingFang SC, sans-serif">programming 域</text>
  <text x="357" y="161" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">planner（轨迹·节拍）</text>
  <text x="357" y="178" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">program · sequence</text>
  <text x="357" y="195" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">progdiff · incremental</text>
  <text x="357" y="212" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">project · perf</text>
  <text x="357" y="232" font-size="11" fill="#185FA5" font-family="PingFang SC, sans-serif">OLP 核心业务</text>

  <rect x="499" y="120" width="141" height="124" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="510" y="140" font-size="12" font-weight="500" fill="#042C53" font-family="PingFang SC, sans-serif">process 工艺域</text>
  <text x="510" y="161" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">process（焊/涂工艺）</text>
  <text x="510" y="178" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">pickplace · cam</text>
  <text x="510" y="195" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">compliance·calibration</text>
  <text x="510" y="212" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">Weld / Clean / Grind</text>
  <text x="510" y="232" font-size="11" fill="#185FA5" font-family="PingFang SC, sans-serif">IPC 产品线的落点</text>

  <rect x="40" y="262" width="141" height="124" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="51" y="282" font-size="12" font-weight="500" fill="#042C53" font-family="PingFang SC, sans-serif">control 控制域</text>
  <text x="51" y="303" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">link · twinsync</text>
  <text x="51" y="320" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">linkstub · sshstub</text>
  <text x="51" y="337" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">cloudhttp · panel(债)</text>
  <text x="51" y="357" font-size="11" fill="#185FA5" font-family="PingFang SC, sans-serif">真机 = 唯一网络边界</text>

  <rect x="193" y="262" width="141" height="124" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="204" y="282" font-size="12" font-weight="500" fill="#042C53" font-family="PingFang SC, sans-serif">plc 域（最小域）</text>
  <text x="204" y="303" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">plc_scl（SCL 出码）</text>
  <text x="204" y="320" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">iomap（IO 点表）</text>
  <text x="204" y="340" font-size="11" fill="#185FA5" font-family="PingFang SC, sans-serif">试点迁移先走它；</text>
  <text x="204" y="357" font-size="11" fill="#185FA5" font-family="PingFang SC, sans-serif">两年不扩张则并 control</text>

  <rect x="346" y="262" width="141" height="124" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="357" y="282" font-size="12" font-weight="500" fill="#042C53" font-family="PingFang SC, sans-serif">simulation 仿真域</text>
  <text x="357" y="303" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">simulation·multirobot</text>
  <text x="357" y="320" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">animation（自 world）</text>
  <text x="357" y="340" font-size="11" fill="#185FA5" font-family="PingFang SC, sans-serif">虚拟设备 · 回环打桩</text>
  <text x="357" y="357" font-size="11" fill="#185FA5" font-family="PingFang SC, sans-serif">相机/扫描仪虚拟化</text>

  <rect x="499" y="262" width="141" height="124" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="510" y="282" font-size="12" font-weight="500" fill="#042C53" font-family="PingFang SC, sans-serif">post 适配器（Adapter）</text>
  <text x="510" y="303" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">post/ 8 品牌注册表</text>
  <text x="510" y="320" font-size="11" fill="#0C447C" font-family="PingFang SC, sans-serif">Jinja2 模板 + base</text>
  <text x="510" y="340" font-size="11" fill="#185FA5" font-family="PingFang SC, sans-serif">走 PluginRegistry</text>
  <text x="510" y="357" font-size="11" fill="#185FA5" font-family="PingFang SC, sans-serif">新品牌 = 新模板</text>

  <line x1="340" y1="390" x2="340" y2="404" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrowD)"/>

  <rect x="40" y="408" width="600" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="60" y="430" font-size="13" font-weight="500" fill="#3C3489" font-family="PingFang SC, sans-serif">共享内核 kernel（无业务语义，全域可用）</text>
  <text x="60" y="452" font-size="11" fill="#534AB7" font-family="PingFang SC, sans-serif">pose 空间数学（矩阵/四元数/变换） · debug · i18n · features 门控 · plugins 注册表 · ocpcompat</text>
  <text x="60" y="472" font-size="11" fill="#534AB7" font-family="PingFang SC, sans-serif">C++ 加速边界 _orolp_core：仅 __init__ / kinematics / collision 可触（pybind11 透明降级）</text>

  <text x="40" y="514" font-size="11" fill="#5F5E5A" font-family="PingFang SC, sans-serif">依赖方向：app → 业务域 → kernel；Adapter 只依赖 domain 抽象，禁止反向。</text>
  <text x="40" y="530" font-size="11" fill="#5F5E5A" font-family="PingFang SC, sans-serif">设备扩展：SDK/驱动 → 设备适配器注册表 · 业务用例 → 所属业务域 · 虚拟设备 → simulation。</text>
</svg>
